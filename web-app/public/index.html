<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LambdaTest QA Agent</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a href="#/" class="brand">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F2A65A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <div>
            <div class="brand-name">LambdaTest QA Agent</div>
            <div class="brand-sub" id="envLine">Checking setup…</div>
          </div>
        </a>
        <div class="site-under-test">Site under test: <b id="siteUnderTest">—</b></div>
      </div>
    </header>

    <nav aria-label="Progress" class="stepbar">
      <ol class="wrap steps" id="steps"></ol>
    </nav>

    <main class="wrap main" id="app"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
